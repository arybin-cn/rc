#--------------------------------------------------------------------
# prefix
#--------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind a send-prefix

#--------------------------------------------------------------------
# general
#--------------------------------------------------------------------
unbind &
unbind %
unbind w
unbind '"'
set -g set-clipboard on
set -g mouse on
unbind -n MouseDown3Pane
set -g default-terminal "tmux-256color"        
set -as terminal-overrides ",xterm-256color:Tc"
set -g history-limit 10000000
setw -g mode-keys vi
set -sg escape-time 0

#--------------------------------------------------------------------
# window
#--------------------------------------------------------------------
set -g base-index 1
set -g renumber-windows on

bind \\ split-window -h
bind - split-window -v
bind K confirm-before -p "kill-window #W? (y/n)" kill-window
bind -n M-j previous-window
bind -n M-k next-window
bind -n M-c new-window
bind -n M-d kill-window
bind -n M-h swap-window -d -t -
bind -n M-l swap-window -d -t +
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

#--------------------------------------------------------------------
# pane
#--------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind < resize-pane -L 5
bind > resize-pane -R 5
bind _ resize-pane -D 5
bind + resize-pane -U 5

#--------------------------------------------------------------------
# status line
#--------------------------------------------------------------------
set -g status-interval 2
set -g status-justify centre
set -g status-left " #S@#h                              "
set -g status-left-length 18
set -g status-right " %Y/%m/%d %H:%M "
set -g status-right-length 18
set -g window-status-current-style "fg=green,bg=black,bold"
set -g window-status-style "fg=black,bg=default"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
